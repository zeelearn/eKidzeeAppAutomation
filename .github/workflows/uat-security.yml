name: UAT - DevSecOps Security & Quality

on:
  push:
    branches:
      - uat

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: uat-security-${{ github.repository }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "stable"
  NODE_VERSION: "22"

jobs:

  # ============================================================
  # 1. DETECT PROJECT TYPE
  # ============================================================

  detect:
    name: Detect Project Type
    runs-on: ubuntu-latest

    outputs:
      flutter: ${{ steps.detect.outputs.flutter }}
      node: ${{ steps.detect.outputs.node }}
      angular: ${{ steps.detect.outputs.angular }}

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect project
        id: detect
        shell: bash
        run: |

          echo "Detecting project type..."

          if [ -f "pubspec.yaml" ]; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "package.json" ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "angular.json" ]; then
            echo "angular=true" >> "$GITHUB_OUTPUT"
          else
            echo "angular=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Flutter: $(grep -q 'flutter=true' "$GITHUB_OUTPUT" && echo yes || echo no)"
          echo "Node:    $(grep -q 'node=true' "$GITHUB_OUTPUT" && echo yes || echo no)"
          echo "Angular: $(grep -q 'angular=true' "$GITHUB_OUTPUT" && echo yes || echo no)"


  # ============================================================
  # 2. SECRET SCANNING - GITLEAKS
  # ============================================================

  gitleaks:
    name: Secret Scan - Gitleaks
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b9 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        shell: bash
        run: |

          semgrep scan \
            --config auto \
            --error \
            --exclude .git \
            --exclude build \
            --exclude node_modules \
            --exclude .dart_tool \
            --exclude ios/Pods \
            --exclude android/.gradle \
            --exclude '**/firebase_options.dart'

    # ============================================================
  # 9. SONARQUBE CODE QUALITY
  # ============================================================

  sonarqube:
    name: 📊 SonarQube Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  # ============================================================
  # 4. TRIVY - DEPENDENCY / FILESYSTEM SECURITY
  # ============================================================

  trivy:
    name: Vulnerability Scan - Trivy
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table


  # ============================================================
  # 5. FLUTTER / DART QUALITY
  # ============================================================

  flutter:
    name: Flutter Quality
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --fatal-infos

      - name: Flutter Tests
        run: flutter test


  # ============================================================
  # 6. NODE / ANGULAR QUALITY
  # ============================================================

  node:
    name: Node / Angular Quality
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@8207627 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found. Skipping."
          fi

      - name: TypeScript Check
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json found. Skipping."
          fi

      - name: Unit Tests
        run: |
          if npm run | grep -q "test"; then
            npm test -- --runInBand
          else
            echo "No test script found. Skipping."
          fi

      - name: NPM Audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. ANGULAR BUILD
  # ============================================================

  angular:
    name: Angular Build
    needs: detect
    if: needs.detect.outputs.angular == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@8207627 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Angular Build
        run: npm run build


  # ============================================================
  # 8. SONARQUBE CODE QUALITY
  # ============================================================

  sonarqube:
    name: SonarQube Code Quality
    needs: detect
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2291811 # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0 # v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


  # ============================================================
  # 9. FINAL SECURITY / QUALITY GATE
  # ============================================================

  security-gate:
    name: Final UAT Security Gate
    needs:
      - detect
      - gitleaks
      - semgrep
      - trivy
      - flutter
      - node
      - angular
      - sonarqube

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Evaluate Security Gate
        shell: bash
        run: |

          echo "=========================================="
          echo "        UAT DEVSECOPS SECURITY GATE"
          echo "=========================================="

          echo ""
          echo "Gitleaks : ${{ needs.gitleaks.result }}"
          echo "Semgrep  : ${{ needs.semgrep.result }}"
          echo "Trivy    : ${{ needs.trivy.result }}"
          echo "Flutter  : ${{ needs.flutter.result }}"
          echo "Node     : ${{ needs.node.result }}"
          echo "Angular  : ${{ needs.angular.result }}"
          echo "SonarQube: ${{ needs.sonarqube.result }}"
          echo ""

          FAILED=false

          if [[ "${{ needs.gitleaks.result }}" == "failure" ]]; then
            echo "❌ Gitleaks failed"
            FAILED=true
          fi

          if [[ "${{ needs.semgrep.result }}" == "failure" ]]; then
            echo "❌ Semgrep failed"
            FAILED=true
          fi

          if [[ "${{ needs.trivy.result }}" == "failure" ]]; then
            echo "❌ Trivy failed"
            FAILED=true
          fi

          if [[ "${{ needs.flutter.result }}" == "failure" ]]; then
            echo "❌ Flutter checks failed"
            FAILED=true
          fi

          if [[ "${{ needs.node.result }}" == "failure" ]]; then
            echo "❌ Node checks failed"
            FAILED=true
          fi

          if [[ "${{ needs.angular.result }}" == "failure" ]]; then
            echo "❌ Angular build failed"
            FAILED=true
          fi

          if [[ "${{ needs.sonarqube.result }}" == "failure" ]]; then
            echo "❌ SonarQube Quality Gate failed"
            FAILED=true
          fi

          echo ""

          if [[ "$FAILED" == "true" ]]; then
            echo "=========================================="
            echo "❌ UAT SECURITY GATE FAILED"
            echo "Code cannot proceed to MAIN."
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "✅ UAT SECURITY GATE PASSED"
          echo "=========================================="


 
