name: Flutter Kidzee CI/CD

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # set your Flutter version here
      - name: Configure Git for Private Repos
        run: | 
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Kidzee APK
        run: flutter build apk --flavor kidzee --release

      - name: Build Kidzee App Bundle (AAB)
        run: flutter build appbundle --flavor kidzee --release

      - name: Upload Kidzee APK
        uses: actions/upload-artifact@v4
        with:
          name: kidzee-apk
          path: build/app/outputs/flutter-apk/app-kidzee-release.apk
          if-no-files-found: error

      - name: Upload Kidzee AAB
        uses: actions/upload-artifact@v4
        with:
          name: kidzee-aab
          path: build/app/outputs/bundle/kidzeeRelease/app-kidzee-release.aab
          if-no-files-found: error
